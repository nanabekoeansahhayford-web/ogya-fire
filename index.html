<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OGYA (FIRE) - Ghana Marketplace</title>
    <meta name="description" content="OGYA (FIRE) - Ghana Marketplace for Vehicles, Property, Phones, Electronics, Food, Jobs &amp; Services." />
    <meta property="og:title" content="OGYA (FIRE) - Ghana Marketplace" />
    <meta property="og:description" content="Buy, sell, order on WhatsApp, and trade safely across Ghana on OGYA (FIRE)." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#FF6B00" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OGYA" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <style>
      #ogya-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        background-color: #000000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        opacity: 1;
        overflow: hidden;
        transition: opacity 0.45s ease, visibility 0.45s ease;
        user-select: none;
        -webkit-user-select: none;
      }

      #ogya-splash.ogya-splash--hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .ogya-flame-wrap {
        position: relative;
        width: clamp(96px, 24vw, 120px);
        height: clamp(108px, 27vw, 132px);
        margin-bottom: 20px;
      }

      .ogya-flame-glow {
        position: absolute;
        left: 50%;
        bottom: 4%;
        width: 120%;
        height: 70%;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 107, 0, 0.55) 0%, rgba(255, 184, 0, 0.2) 45%, rgba(0, 0, 0, 0) 75%);
        filter: blur(12px);
        transform: translateX(-50%);
        animation: ogyaGlowPulse 1.1s ease-in-out infinite alternate;
      }

      .ogya-flame-outer {
        position: absolute;
        left: 50%;
        bottom: 14%;
        width: clamp(64px, 16vw, 80px);
        height: clamp(64px, 16vw, 80px);
        border-radius: 0 65% 52% 65%;
        background: linear-gradient(135deg, #ff3d00 0%, #ff6b00 45%, #ff9e00 100%);
        box-shadow: 0 0 28px rgba(255, 107, 0, 0.75), 0 0 54px rgba(255, 69, 0, 0.4);
        transform-origin: center center;
        transform: translateX(-50%) rotate(45deg);
        animation: ogyaFlickerOuter 0.9s ease-in-out infinite alternate;
      }

      .ogya-flame-mid {
        position: absolute;
        left: 50%;
        bottom: 18%;
        width: clamp(44px, 11vw, 56px);
        height: clamp(44px, 11vw, 56px);
        border-radius: 0 65% 52% 65%;
        background: linear-gradient(135deg, #ff7b00 0%, #ffb700 55%, #ffe14d 100%);
        transform-origin: center center;
        transform: translateX(-50%) rotate(45deg);
        animation: ogyaFlickerMid 0.75s ease-in-out infinite alternate;
      }

      .ogya-flame-core {
        position: absolute;
        left: 50%;
        bottom: 22%;
        width: clamp(24px, 6vw, 32px);
        height: clamp(24px, 6vw, 32px);
        border-radius: 0 65% 52% 65%;
        background: linear-gradient(135deg, #ffd000 0%, #fff08a 60%, #ffffff 100%);
        transform-origin: center center;
        transform: translateX(-50%) rotate(45deg);
        animation: ogyaFlickerCore 0.6s ease-in-out infinite alternate;
      }

      .ogya-splash-title {
        margin: 0;
        color: #ff6b00;
        font-size: clamp(1.75rem, 6vw, 2.5rem);
        font-weight: 900;
        letter-spacing: 0.08em;
        line-height: 1.1;
        text-align: center;
      }

      .ogya-splash-sub {
        margin: 6px 0 0;
        color: #ffffff;
        font-size: clamp(0.85rem, 2.8vw, 1rem);
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        text-align: center;
        opacity: 0.92;
      }

      @keyframes ogyaGlowPulse {
        0% {
          transform: translateX(-50%) scale(0.94);
          opacity: 0.75;
        }
        100% {
          transform: translateX(-50%) scale(1.08);
          opacity: 1;
        }
      }

      @keyframes ogyaFlickerOuter {
        0% {
          transform: translateX(-50%) rotate(44deg) scale(0.98, 1.03) skewX(-2deg);
        }
        35% {
          transform: translateX(-50%) rotate(46deg) scale(1.03, 0.97) skewX(2deg);
        }
        70% {
          transform: translateX(-50%) rotate(43deg) scale(0.99, 1.05) skewX(-1deg);
        }
        100% {
          transform: translateX(-50%) rotate(46deg) scale(1.02, 1.01) skewX(2deg);
        }
      }

      @keyframes ogyaFlickerMid {
        0% {
          transform: translateX(-50%) rotate(46deg) scale(0.96, 1.04);
        }
        50% {
          transform: translateX(-50%) rotate(43deg) scale(1.04, 0.96);
        }
        100% {
          transform: translateX(-50%) rotate(46deg) scale(1, 1.06);
        }
      }

      @keyframes ogyaFlickerCore {
        0% {
          transform: translateX(-50%) rotate(44deg) scale(0.95, 1.05);
          opacity: 0.92;
        }
        100% {
          transform: translateX(-50%) rotate(47deg) scale(1.06, 0.96);
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .ogya-flame-glow,
        .ogya-flame-outer,
        .ogya-flame-mid,
        .ogya-flame-core {
          animation: none;
        }
      }
    </style>
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('ogya_theme');
          var supportDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (theme === 'dark' || (!theme && supportDarkMode)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F8F9FA] dark:bg-[#0b0f19] text-slate-900 dark:text-slate-100 antialiased font-sans selection:bg-amber-500 selection:text-white min-h-screen transition-colors duration-200">
    <!-- Animated Flame Splash Screen -->
    <div id="ogya-splash" role="status" aria-label="Loading OGYA FIRE Food and Market">
      <div class="ogya-flame-wrap" aria-hidden="true">
        <div class="ogya-flame-glow"></div>
        <div class="ogya-flame-outer"></div>
        <div class="ogya-flame-mid"></div>
        <div class="ogya-flame-core"></div>
      </div>
      <div class="ogya-splash-title">OGYA FIRE</div>
      <p class="ogya-splash-sub">Food &amp; Market</p>
    </div>

    <div id="root"></div>

    <script>
      (function() {
        var splash = document.getElementById('ogya-splash');
        if (!splash) return;
        setTimeout(function() {
          splash.classList.add('ogya-splash--hide');
          setTimeout(function() {
            if (splash && splash.parentNode) {
              splash.parentNode.removeChild(splash);
            }
          }, 480);
        }, 2200);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
