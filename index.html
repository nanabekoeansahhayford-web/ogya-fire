<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OGYA (FIRE) 🔥 - Premier Marketplace & Classifieds</title>
    <meta name="description" content="OGYA (FIRE) 🔥 - The Hottest Deals, Classifieds & Marketplace for Vehicles, Property, Phones, Electronics, Jobs & More." />
    <meta property="og:title" content="OGYA (FIRE) 🔥 - Premier Marketplace & Classifieds" />

    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('ogya_theme');
          var supportDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (theme === 'dark' || (!theme && supportDarkMode)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F8F9FA] dark:bg-[#0b0f19] text-slate-900 dark:text-slate-100 antialiased font-sans selection:bg-amber-500 selection:text-white min-h-screen transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
